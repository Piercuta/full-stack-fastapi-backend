{{- if .Values.externalSecrets.enabled }}
# Cluster-scoped store: namespaced SecretStore cannot reference a SA in another namespace.
# Uses ESO controller IRSA (SA external-secrets / namespace external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  labels:
    {{- include "fastapi-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.config.AWS_REGION | default "eu-west-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.secretStore.serviceAccountName | default "external-secrets" }}
            namespace: {{ .Values.externalSecrets.secretStore.serviceAccountNamespace | default "external-secrets" }}
{{- end }}
