replicaCount: 1

image:
  repository: fastapi-app
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: fastapi-app

serviceAccount:
  create: true
  name: fastapi-app
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/utils/health-check/

ingress:
  enabled: true
  className: alb
  host: api.example.com

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 768Mi

config:
  PROJECT_NAME: test-k8s
  ENVIRONMENT: dev
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_DB: app
  FILE_SERVICE_URL: http://file-service
  AWS_REGION: eu-west-1
  FIRST_SUPERUSER: admin@example.com

# SSM → K8s Secret via External Secrets Operator (GitOps / Helm on EKS).
externalSecrets:
  enabled: false
  ssmPrefix: ""
  refreshInterval: 1h
  clusterSecretStoreName: test-k8s-ssm
  secretStore:
    serviceAccountName: external-secrets
    serviceAccountNamespace: external-secrets

# Optional Helm-only secrets when ESO is disabled.
secrets: {}
