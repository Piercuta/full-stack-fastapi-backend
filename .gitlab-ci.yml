# Build the FastAPI image, push it to ECR, then deploy via:
#   - gitops (default): bump image.tag on GitOps branch main → Argo CD syncs
#       branch `dev`           → values-dev.yaml
#       tag / master (manual)  → values-prod.yaml
#   - kustomize / helm: apply directly to EKS (legacy / fallback)
#
#   push `dev`              → build + deploy automatically (environment `dev`)
#   push `master` / `main`  → build + deploy (manual play button, environment `prod`)
#   git tag                 → build + deploy (manual play button, environment `prod`)
#
# GitLab CI/CD variables:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (masked)
#   K8S_SECRETS_ENV        required for kustomize/helm only
#   GITOPS_SSH_PRIVATE_KEY File or Variable: SSH private key with write access
#                          to Piercuta/full-stack-git-ops
#   AWS_REGION             optional, defaults to eu-west-1
#   DEPLOY_TOOL            gitops (default) | kustomize | helm
#   GITOPS_REPO            defaults to git@github.com:Piercuta/full-stack-git-ops.git
#   GITOPS_BRANCH          defaults to main
#
# IAM: ssm:GetParameter on /test-k8s/* , ECR push; EKS only if DEPLOY_TOOL != gitops.
# The GitLab runner must allow Docker-in-Docker (privileged / docker:dind).

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        DEPLOY_ENV: dev
        OVERLAY: dev
        FLOATING_TAG: dev
        SSM_PREFIX: /test-k8s/dev
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
      variables:
        DEPLOY_ENV: prod
        OVERLAY: prod
        FLOATING_TAG: latest
        SSM_PREFIX: /test-k8s/prod
    - if: $CI_COMMIT_TAG
      variables:
        DEPLOY_ENV: prod
        OVERLAY: prod
        FLOATING_TAG: latest
        SSM_PREFIX: /test-k8s/prod

stages:
  - build
  - deploy
  - migrate

variables:
  PROJECT_NAME: test-k8s
  AWS_DEFAULT_REGION: $AWS_REGION
  AWS_REGION: eu-west-1
  K8S_NAMESPACE: test-k8s
  DEPLOY_TOOL: gitops
  GITOPS_REPO: git@github.com:Piercuta/full-stack-git-ops.git
  GITOPS_BRANCH: main
  DOCKER_TLS_CERTDIR: "/certs"

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  environment:
    name: $DEPLOY_ENV
  before_script:
    - apk add --no-cache aws-cli jq
  script:
    - |
      ssm_get() {
        val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
        if [ -z "$val" ] || [ "$val" = "None" ]; then
          echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
          exit 1
        fi
        printf '%s' "$val"
      }

      CLUSTER=$(ssm_get eks_cluster_name)
      ECR_URI=$(ssm_get ecr_fastapi_app)
      POSTGRES_SERVER=$(ssm_get aurora_cluster_endpoint)
      FRONTEND_HOST=$(ssm_get site_url)
      AWS_SECRET_ARN=$(ssm_get aurora_master_user_secret_arn)
      COGNITO_CLIENT_ID=$(ssm_get cognito_client_id)
      COGNITO_ISSUER=$(ssm_get cognito_issuer)
      COGNITO_DOMAIN=$(ssm_get cognito_domain)
      IRSA_ROLE_ARN=$(ssm_get api_irsa_role_arn)
      MEDIA_QUEUE_URL=$(aws ssm get-parameter --name "${SSM_PREFIX}/media_queue_url" --query Parameter.Value --output text 2>/dev/null || true)
      if [ "$MEDIA_QUEUE_URL" = "None" ]; then MEDIA_QUEUE_URL=; fi

      ECR_REGISTRY=$(echo "$ECR_URI" | cut -d/ -f1)
      aws ecr get-login-password --region "${AWS_REGION}" \
        | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      docker build \
        -t "${ECR_URI}:${CI_COMMIT_SHA}" \
        -t "${ECR_URI}:${FLOATING_TAG}" \
        .
      docker push "${ECR_URI}:${CI_COMMIT_SHA}"
      docker push "${ECR_URI}:${FLOATING_TAG}"

      {
        echo "CLUSTER=${CLUSTER}"
        echo "ECR_URI=${ECR_URI}"
        echo "POSTGRES_SERVER=${POSTGRES_SERVER}"
        echo "FRONTEND_HOST=${FRONTEND_HOST}"
        echo "AWS_SECRET_ARN=${AWS_SECRET_ARN}"
        echo "COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}"
        echo "COGNITO_ISSUER=${COGNITO_ISSUER}"
        echo "COGNITO_DOMAIN=${COGNITO_DOMAIN}"
        echo "IRSA_ROLE_ARN=${IRSA_ROLE_ARN}"
        echo "MEDIA_QUEUE_URL=${MEDIA_QUEUE_URL}"
        echo "IMAGE_TAG=${CI_COMMIT_SHA}"
      } > build.env

      echo "Cluster=${CLUSTER} ECR=${ECR_URI} tag=${CI_COMMIT_SHA}"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

deploy:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build
      artifacts: true
  environment:
    name: $DEPLOY_ENV
  resource_group: deploy-eks-$DEPLOY_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
      when: manual
    - when: manual
  before_script:
    - |
      if [ "${DEPLOY_TOOL}" = "gitops" ]; then
        apk add --no-cache git openssh-client
      else
        apk add --no-cache aws-cli jq curl
        curl -sLO "https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl"
        chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
        kubectl version --client
        if [ "${DEPLOY_TOOL}" = "helm" ]; then
          curl -sL "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz" | tar xz
          mv linux-amd64/helm /usr/local/bin/helm
          helm version
        else
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          mv kustomize /usr/local/bin/kustomize
          kustomize version
        fi
      fi
  script:
    - |
      set -euo pipefail
      if [ "${DEPLOY_TOOL}" = "gitops" ]; then
        if [ -z "${GITOPS_SSH_PRIVATE_KEY:-}" ]; then
          echo "Missing GITOPS_SSH_PRIVATE_KEY (File or Variable CI/CD)" >&2
          exit 1
        fi
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        if [ -f "${GITOPS_SSH_PRIVATE_KEY}" ]; then
          cp "${GITOPS_SSH_PRIVATE_KEY}" ~/.ssh/id_ed25519
        else
          printf '%s\n' "${GITOPS_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
        fi
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

        VALUES_FILE="apps/fastapi-app/values-${DEPLOY_ENV}.yaml"
        git clone --depth 1 --branch "${GITOPS_BRANCH}" "${GITOPS_REPO}" gitops-repo
        cd gitops-repo
        if [ ! -f "$VALUES_FILE" ]; then
          echo "Missing ${VALUES_FILE} on ${GITOPS_BRANCH}" >&2
          exit 1
        fi
        awk -v repo="$ECR_URI" -v tag="$IMAGE_TAG" '
          BEGIN { in_image = 0 }
          /^image:/ { in_image = 1; print; next }
          in_image && /^[^ ]/ { in_image = 0 }
          in_image && /^[[:space:]]+repository:/ { print "  repository: " repo; next }
          in_image && /^[[:space:]]+tag:/ { print "  tag: \"" tag "\""; next }
          { print }
        ' "$VALUES_FILE" > "${VALUES_FILE}.tmp"
        mv "${VALUES_FILE}.tmp" "$VALUES_FILE"
        git config user.email "gitlab-ci@users.noreply.github.com"
        git config user.name "gitlab-ci"
        git add "$VALUES_FILE"
        if git diff --staged --quiet; then
          echo "Image tag already ${IMAGE_TAG}; nothing to commit."
          exit 0
        fi
        git commit -m "chore(fastapi-app): bump image to ${IMAGE_TAG} (${DEPLOY_ENV})"
        git push origin "HEAD:${GITOPS_BRANCH}"
        echo "Pushed GitOps update; Argo CD will sync automatically."
        exit 0
      fi

      if [ -z "$K8S_SECRETS_ENV" ]; then
        echo "Missing GitLab CI variable K8S_SECRETS_ENV on environment ${DEPLOY_ENV}" >&2
        exit 1
      fi
      if [ -f "$K8S_SECRETS_ENV" ]; then
        CONTENT=$(cat "$K8S_SECRETS_ENV")
      else
        CONTENT=$K8S_SECRETS_ENV
      fi
      if printf '%s' "$CONTENT" | jq -e 'type == "object"' >/dev/null 2>&1; then
        printf '%s' "$CONTENT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > /tmp/secrets.env
      else
        printf '%s\n' "$CONTENT" > /tmp/secrets.env
      fi
      aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}"
      echo "GitLab CI IAM identity (this ARN needs an EKS access entry):"
      aws sts get-caller-identity
      if ! kubectl get namespace "${K8S_NAMESPACE}"; then
        echo "EKS rejected these credentials." >&2
        exit 1
      fi
      if [ "${DEPLOY_TOOL}" = "helm" ]; then
        REPLICAS=1
        INGRESS_HOST="api-test-k8s.dev.piercuta.com"
        if [ "${DEPLOY_ENV}" != "dev" ]; then
          REPLICAS=2
          INGRESS_HOST="api-test-k8s.prod.piercuta.com"
        fi
        {
          printf '%s\n' \
            "replicaCount: ${REPLICAS}" \
            "image:" \
            "  repository: ${ECR_URI}" \
            "  tag: \"${IMAGE_TAG}\"" \
            "serviceAccount:" \
            "  annotations:" \
            "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
            "ingress:" \
            "  host: \"${INGRESS_HOST}\"" \
            "config:" \
            "  ENVIRONMENT: \"${DEPLOY_ENV}\"" \
            "  POSTGRES_SERVER: \"${POSTGRES_SERVER}\"" \
            "  FRONTEND_HOST: \"${FRONTEND_HOST}\"" \
            "  AWS_SECRET_ARN: \"${AWS_SECRET_ARN}\"" \
            "  COGNITO_CLIENT_ID: \"${COGNITO_CLIENT_ID}\"" \
            "  COGNITO_ISSUER: \"${COGNITO_ISSUER}\"" \
            "  COGNITO_DOMAIN: \"${COGNITO_DOMAIN}\"" \
            "  MEDIA_QUEUE_URL: \"${MEDIA_QUEUE_URL}\"" \
            "secrets:"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|\#*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            printf '  %s: %s\n' "$key" "$(printf '%s' "$val" | jq -Rs .)"
          done < /tmp/secrets.env
        } > /tmp/helm-ci-values.yaml
        helm upgrade --install fastapi-app ./charts/fastapi-app \
          -n "${K8S_NAMESPACE}" \
          -f /tmp/helm-ci-values.yaml \
          --wait --timeout 180s
      else
        (
          cd "k8s/overlays/${OVERLAY}"
          cp /tmp/secrets.env secrets.env
          printf 'POSTGRES_SERVER=%s\nFRONTEND_HOST=%s\nAWS_SECRET_ARN=%s\nMEDIA_QUEUE_URL=%s\nCOGNITO_CLIENT_ID=%s\nCOGNITO_ISSUER=%s\nCOGNITO_DOMAIN=%s\n' \
            "$POSTGRES_SERVER" "$FRONTEND_HOST" "$AWS_SECRET_ARN" "$MEDIA_QUEUE_URL" \
            "$COGNITO_CLIENT_ID" "$COGNITO_ISSUER" "$COGNITO_DOMAIN" \
            > generated-config.env
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: ServiceAccount' \
            'metadata:' \
            '  name: fastapi-app' \
            '  annotations:' \
            "    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}" \
            > irsa-patch.yaml
          kustomize edit set image "fastapi-app=${ECR_URI}:${IMAGE_TAG}"
        )
        kubectl apply -k "k8s/overlays/${OVERLAY}"
        kubectl rollout status "deployment/fastapi-app" -n "${K8S_NAMESPACE}" --timeout=180s
      fi

# Manual one-shot: alembic upgrade + initial_data (same as local kubectl Job).
migrate:
  stage: migrate
  image: alpine:3.21
  needs: []
  environment:
    name: $DEPLOY_ENV
  resource_group: migrate-eks-$DEPLOY_ENV
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache aws-cli curl
    - curl -sLO "https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
  script:
    - |
      set -euo pipefail
      CLUSTER=$(aws ssm get-parameter --name "${SSM_PREFIX}/eks_cluster_name" --query Parameter.Value --output text)
      aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}"
      IMG=$(kubectl -n "${K8S_NAMESPACE}" get deploy fastapi-app \
        -o jsonpath='{.spec.template.spec.containers[0].image}')
      JOB="fastapi-migrate-${CI_PIPELINE_ID}"
      kubectl -n "${K8S_NAMESPACE}" delete job "${JOB}" --ignore-not-found
      printf '%s\n' \
        "apiVersion: batch/v1" \
        "kind: Job" \
        "metadata:" \
        "  name: ${JOB}" \
        "spec:" \
        "  ttlSecondsAfterFinished: 600" \
        "  backoffLimit: 0" \
        "  template:" \
        "    spec:" \
        "      restartPolicy: Never" \
        "      serviceAccountName: fastapi-app" \
        "      containers:" \
        "        - name: migrate" \
        "          image: ${IMG}" \
        "          imagePullPolicy: IfNotPresent" \
        "          command: [\"bash\", \"scripts/prestart.sh\"]" \
        "          envFrom:" \
        "            - configMapRef:" \
        "                name: fastapi-app-config" \
        "            - secretRef:" \
        "                name: fastapi-app-secrets" \
        > /tmp/migrate-job.yaml
      kubectl -n "${K8S_NAMESPACE}" apply -f /tmp/migrate-job.yaml
      if ! kubectl -n "${K8S_NAMESPACE}" wait --for=condition=complete "job/${JOB}" --timeout=300s; then
        kubectl -n "${K8S_NAMESPACE}" logs "job/${JOB}" || true
        exit 1
      fi
      kubectl -n "${K8S_NAMESPACE}" logs "job/${JOB}"
