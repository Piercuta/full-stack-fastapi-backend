name: Deploy Helm (FastAPI)
run-name: FastAPI · Helm · ${{ inputs.environment }} · ${{ inputs.image_tag }}

# Deploy FastAPI directly to EKS with Helm (fallback / debug — bypasses GitOps).
#
# Actions → "Deploy Helm" → pick environment + image tag
#
# Secrets:
#   K8S_SECRETS_ENV          required on the target GitHub environment
#
# Vars:
#   AWS_ROLE_ARN
#   AWS_REGION               defaults to eu-west-1

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: ECR image tag (commit SHA or release tag)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  K8S_NAMESPACE: test-k8s
  DEPLOY_ENV: ${{ inputs.environment }}
  SSM_PREFIX: /test-k8s/${{ inputs.environment }}
  OVERLAY: ${{ inputs.environment }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    name: Helm upgrade
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-helm-fastapi-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM parameters
        id: ssm
        uses: ./.github/actions/read-fastapi-ssm
        with:
          ssm_prefix: ${{ env.SSM_PREFIX }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Prepare secrets file
        uses: ./.github/actions/prepare-k8s-secrets
        with:
          k8s_secrets_env: ${{ secrets.K8S_SECRETS_ENV }}
          deploy_env: ${{ env.DEPLOY_ENV }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.ssm.outputs.cluster }}" --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Verify cluster access
        run: |
          echo "GitHub Actions IAM identity (this ARN needs an EKS access entry):"
          aws sts get-caller-identity
          if ! kubectl get namespace "${K8S_NAMESPACE}"; then
            echo "EKS rejected these credentials. Add this IAM principal as an access entry on ${{ steps.ssm.outputs.cluster }} with AmazonEKSClusterAdminPolicy." >&2
            exit 1
          fi

      - name: Deploy with Helm
        env:
          POSTGRES_SERVER: ${{ steps.ssm.outputs.postgres_server }}
          FRONTEND_HOST: ${{ steps.ssm.outputs.frontend_host }}
          AWS_SECRET_ARN: ${{ steps.ssm.outputs.aws_secret_arn }}
          COGNITO_CLIENT_ID: ${{ steps.ssm.outputs.cognito_client_id }}
          COGNITO_ISSUER: ${{ steps.ssm.outputs.cognito_issuer }}
          COGNITO_DOMAIN: ${{ steps.ssm.outputs.cognito_domain }}
          IRSA_ROLE_ARN: ${{ steps.ssm.outputs.irsa_role_arn }}
          MEDIA_QUEUE_URL: ${{ steps.ssm.outputs.media_queue_url }}
          ECR_URI: ${{ steps.ssm.outputs.ecr_uri }}
        run: |
          set -euo pipefail

          REPLICAS=1
          INGRESS_HOST="api-test-k8s.dev.piercuta.com"
          if [ "${DEPLOY_ENV}" != "dev" ]; then
            REPLICAS=2
            INGRESS_HOST="api-test-k8s.prod.piercuta.com"
          fi

          {
            printf '%s\n' \
              "replicaCount: ${REPLICAS}" \
              "image:" \
              "  repository: ${ECR_URI}" \
              "  tag: \"${IMAGE_TAG}\"" \
              "serviceAccount:" \
              "  annotations:" \
              "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
              "ingress:" \
              "  host: \"${INGRESS_HOST}\"" \
              "config:" \
              "  ENVIRONMENT: \"${DEPLOY_ENV}\"" \
              "  POSTGRES_SERVER: \"${POSTGRES_SERVER}\"" \
              "  FRONTEND_HOST: \"${FRONTEND_HOST}\"" \
              "  AWS_SECRET_ARN: \"${AWS_SECRET_ARN}\"" \
              "  COGNITO_CLIENT_ID: \"${COGNITO_CLIENT_ID}\"" \
              "  COGNITO_ISSUER: \"${COGNITO_ISSUER}\"" \
              "  COGNITO_DOMAIN: \"${COGNITO_DOMAIN}\"" \
              "  MEDIA_QUEUE_URL: \"${MEDIA_QUEUE_URL}\"" \
              "secrets:"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"
              val="${line#*=}"
              printf '  %s: %s\n' "$key" "$(printf '%s' "$val" | jq -Rs .)"
            done < /tmp/secrets.env
          } > /tmp/helm-ci-values.yaml

          helm upgrade --install fastapi-app ./charts/fastapi-app \
            -n "${K8S_NAMESPACE}" \
            -f /tmp/helm-ci-values.yaml \
            --wait --timeout 180s
