# Build the FastAPI image, push it to ECR, then deploy via:
#   - gitops (default): bump image.tag on GitOps branch main → Argo CD syncs
#       branch `dev`              → apps/fastapi-app/values-dev.yaml
#       tag (must be on `prod`)   → apps/fastapi-app/values-prod.yaml
#   - kustomize / helm: apply directly to EKS (legacy / fallback)
#
# Triggers:
#   push `dev`         → build + deploy (environment `dev`)
#   push tag           → build + deploy prod (tag commit must be on branch `prod`)
#   workflow_dispatch  → build + deploy (env from ref: `dev` → dev, else prod)
#
# Secrets:
#   K8S_SECRETS_ENV          required for kustomize/helm only
#   GITOPS_SSH_PRIVATE_KEY   required for gitops (SSH key with write access
#                            to Piercuta/full-stack-git-ops)
#
# Vars:
#   AWS_ROLE_ARN
#   AWS_REGION               defaults to eu-west-1
#   DEPLOY_TOOL             gitops (default) | kustomize | helm
#   GITOPS_REPO             defaults to git@github.com:Piercuta/full-stack-git-ops.git
#   GITOPS_BRANCH           defaults to main (single-branch GitOps)
#
# IAM: ssm:GetParameter on /test-k8s/* , ECR push; EKS only if DEPLOY_TOOL != gitops.

name: Build and deploy to EKS

on:
  push:
    branches:
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

env:
  PROJECT_NAME: test-k8s
  K8S_NAMESPACE: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}
  OVERLAY: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  FLOATING_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
  DEPLOY_TOOL: ${{ vars.DEPLOY_TOOL || 'gitops' }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO || 'git@github.com:Piercuta/full-stack-git-ops.git' }}
  GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH || 'main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      cluster: ${{ steps.ssm.outputs.cluster }}
      ecr_uri: ${{ steps.ssm.outputs.ecr_uri }}
      postgres_server: ${{ steps.ssm.outputs.postgres_server }}
      frontend_host: ${{ steps.ssm.outputs.frontend_host }}
      aws_secret_arn: ${{ steps.ssm.outputs.aws_secret_arn }}
      irsa_role_arn: ${{ steps.ssm.outputs.irsa_role_arn }}
      media_queue_url: ${{ steps.ssm.outputs.media_queue_url }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so we can verify a tag commit belongs to branch `prod`
          fetch-depth: 0

      - name: Ensure tag is on prod branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin prod:refs/remotes/origin/prod
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/prod; then
            echo "Refusing prod deploy: tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on branch prod." >&2
            echo "Create the tag from prod, e.g.: git checkout prod && git tag v1.2.3 && git push origin v1.2.3" >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on origin/prod — OK for prod deploy."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM parameters
        id: ssm
        run: |
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }

          CLUSTER=$(ssm_get eks_cluster_name)
          ECR_URI=$(ssm_get ecr_api)
          POSTGRES_SERVER=$(ssm_get aurora_cluster_endpoint)
          FRONTEND_HOST=$(ssm_get site_url)
          AWS_SECRET_ARN=$(ssm_get aurora_master_user_secret_arn)
          IRSA_ROLE_ARN=$(ssm_get api_irsa_role_arn)
          MEDIA_QUEUE_URL=$(aws ssm get-parameter --name "${SSM_PREFIX}/media_queue_url" --query Parameter.Value --output text 2>/dev/null || true)
          if [ "$MEDIA_QUEUE_URL" = "None" ]; then MEDIA_QUEUE_URL=; fi

          echo "cluster=${CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=${ECR_URI}" >> "$GITHUB_OUTPUT"
          echo "postgres_server=${POSTGRES_SERVER}" >> "$GITHUB_OUTPUT"
          echo "frontend_host=${FRONTEND_HOST}" >> "$GITHUB_OUTPUT"
          echo "aws_secret_arn=${AWS_SECRET_ARN}" >> "$GITHUB_OUTPUT"
          echo "irsa_role_arn=${IRSA_ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "media_queue_url=${MEDIA_QUEUE_URL}" >> "$GITHUB_OUTPUT"
          echo "Cluster=${CLUSTER} ECR=${ECR_URI}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ssm.outputs.ecr_uri }}:${{ github.sha }}
            ${{ steps.ssm.outputs.ecr_uri }}:${{ env.FLOATING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.ref_name == 'dev' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name }}
    concurrency:
      group: deploy-eks-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        if: env.DEPLOY_TOOL != 'gitops'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.DEPLOY_TOOL != 'gitops'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Install kubectl
        if: env.DEPLOY_TOOL != 'gitops'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3

      - name: Install kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install Helm
        if: env.DEPLOY_TOOL == 'helm'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Prepare secrets file
        if: env.DEPLOY_TOOL != 'gitops'
        id: secrets
        env:
          K8S_SECRETS_ENV: ${{ secrets.K8S_SECRETS_ENV }}
        run: |
          if [ -z "$K8S_SECRETS_ENV" ]; then
            echo "Missing GitHub secret K8S_SECRETS_ENV on environment ${DEPLOY_ENV}" >&2
            exit 1
          fi
          if [ -f "$K8S_SECRETS_ENV" ]; then
            CONTENT=$(cat "$K8S_SECRETS_ENV")
          else
            CONTENT=$K8S_SECRETS_ENV
          fi
          if printf '%s' "$CONTENT" | jq -e 'type == "object"' >/dev/null 2>&1; then
            printf '%s' "$CONTENT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > /tmp/secrets.env
          else
            printf '%s\n' "$CONTENT" > /tmp/secrets.env
          fi

      - name: Update kubeconfig
        if: env.DEPLOY_TOOL != 'gitops'
        run: aws eks update-kubeconfig --name "${{ needs.build.outputs.cluster }}" --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Verify cluster access
        if: env.DEPLOY_TOOL != 'gitops'
        run: |
          echo "GitHub Actions IAM identity (this ARN needs an EKS access entry):"
          aws sts get-caller-identity
          if ! kubectl get namespace "${K8S_NAMESPACE}"; then
            echo "EKS rejected these credentials. Add this IAM principal as an access entry on ${{ needs.build.outputs.cluster }} with AmazonEKSClusterAdminPolicy (terraform cluster_admin_principal_arns)." >&2
            exit 1
          fi

      - name: Setup GitOps SSH key
        if: env.DEPLOY_TOOL == 'gitops'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}

      - name: Deploy with GitOps (bump image tag)
        if: env.DEPLOY_TOOL == 'gitops'
        env:
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_AUTH_SOCK:-}" ]; then
            echo "SSH agent not loaded. Set GitHub secret GITOPS_SSH_PRIVATE_KEY (private key with write access to the GitOps repo)." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          VALUES_FILE="apps/fastapi-app/values-${DEPLOY_ENV}.yaml"
          git clone --depth 1 --branch "${GITOPS_BRANCH}" "${GITOPS_REPO}" gitops-repo
          cd gitops-repo

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Missing ${VALUES_FILE} in GitOps repo (branch ${GITOPS_BRANCH})" >&2
            exit 1
          fi

          # Update image.repository and image.tag under the image: block
          awk -v repo="$ECR_URI" -v tag="$IMAGE_TAG" '
            BEGIN { in_image = 0 }
            /^image:/ { in_image = 1; print; next }
            in_image && /^[^ ]/ { in_image = 0 }
            in_image && /^[[:space:]]+repository:/ {
              print "  repository: " repo
              next
            }
            in_image && /^[[:space:]]+tag:/ {
              print "  tag: \"" tag "\""
              next
            }
            { print }
          ' "$VALUES_FILE" > "${VALUES_FILE}.tmp"
          mv "${VALUES_FILE}.tmp" "$VALUES_FILE"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$VALUES_FILE"
          if git diff --staged --quiet; then
            echo "Image tag already ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi
          git commit -m "chore(fastapi-app): bump image to ${IMAGE_TAG} (${DEPLOY_ENV})"
          git push origin "HEAD:${GITOPS_BRANCH}"
          echo "Pushed GitOps update; Argo CD will sync automatically."

      - name: Deploy with Kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        env:
          POSTGRES_SERVER: ${{ needs.build.outputs.postgres_server }}
          FRONTEND_HOST: ${{ needs.build.outputs.frontend_host }}
          AWS_SECRET_ARN: ${{ needs.build.outputs.aws_secret_arn }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          MEDIA_QUEUE_URL: ${{ needs.build.outputs.media_queue_url }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          (
            cd "k8s/overlays/${OVERLAY}"
            cp /tmp/secrets.env secrets.env
            printf 'POSTGRES_SERVER=%s\nFRONTEND_HOST=%s\nAWS_SECRET_ARN=%s\nMEDIA_QUEUE_URL=%s\n' \
              "$POSTGRES_SERVER" "$FRONTEND_HOST" "$AWS_SECRET_ARN" "$MEDIA_QUEUE_URL" > generated-config.env
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: ServiceAccount' \
              'metadata:' \
              '  name: fastapi-app' \
              '  annotations:' \
              "    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}" \
              > irsa-patch.yaml
            kustomize edit set image "fastapi-app=${ECR_URI}:${IMAGE_TAG}"
          )
          kubectl apply -k "k8s/overlays/${OVERLAY}"
          kubectl rollout status "deployment/fastapi-app" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Deploy with Helm
        if: env.DEPLOY_TOOL == 'helm'
        env:
          POSTGRES_SERVER: ${{ needs.build.outputs.postgres_server }}
          FRONTEND_HOST: ${{ needs.build.outputs.frontend_host }}
          AWS_SECRET_ARN: ${{ needs.build.outputs.aws_secret_arn }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          MEDIA_QUEUE_URL: ${{ needs.build.outputs.media_queue_url }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REPLICAS=1
          INGRESS_HOST="api-test-k8s.dev.piercuta.com"
          if [ "${DEPLOY_ENV}" != "dev" ]; then
            REPLICAS=2
            INGRESS_HOST="api.test-k8s.piercuta.com"
          fi

          {
            printf '%s\n' \
              "replicaCount: ${REPLICAS}" \
              "image:" \
              "  repository: ${ECR_URI}" \
              "  tag: \"${IMAGE_TAG}\"" \
              "serviceAccount:" \
              "  annotations:" \
              "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
              "ingress:" \
              "  host: \"${INGRESS_HOST}\"" \
              "config:" \
              "  ENVIRONMENT: \"${DEPLOY_ENV}\"" \
              "  POSTGRES_SERVER: \"${POSTGRES_SERVER}\"" \
              "  FRONTEND_HOST: \"${FRONTEND_HOST}\"" \
              "  AWS_SECRET_ARN: \"${AWS_SECRET_ARN}\"" \
              "  MEDIA_QUEUE_URL: \"${MEDIA_QUEUE_URL}\"" \
              "secrets:"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"
              val="${line#*=}"
              printf '  %s: %s\n' "$key" "$(printf '%s' "$val" | jq -Rs .)"
            done < /tmp/secrets.env
          } > /tmp/helm-ci-values.yaml

          helm upgrade --install fastapi-app ./charts/fastapi-app \
            -n "${K8S_NAMESPACE}" \
            -f /tmp/helm-ci-values.yaml \
            --wait --timeout 180s
