# Build the FastAPI image, push it to ECR, then deploy to EKS with
# Kustomize (default) or Helm. Infra values come from SSM Parameter Store:
#   /<project>/<env>/<key>  e.g. /test-k8s/dev/eks_cluster_name
#
#   push `dev`              → build + deploy automatically (environment `dev`)
#   push `master` / `main`  → build only
#   Run workflow on `master` / `main` / tag → build + deploy (manual prod release)
#
# Secrets:
#   K8S_SECRETS_ENV          FIRST_SUPERUSER_PASSWORD + SECRET_KEY (dotenv or JSON)
#
# Vars:
#   AWS_ROLE_ARN
#   AWS_REGION               defaults to eu-west-1
#   DEPLOY_TOOL             kustomize (default) | helm
#
# IAM: ssm:GetParameter on /test-k8s/* , ECR push, EKS API access.

name: Build and deploy to EKS

on:
  push:
    branches:
      - master
      - main
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

env:
  PROJECT_NAME: test-k8s
  K8S_NAMESPACE: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}
  OVERLAY: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  FLOATING_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
  DEPLOY_TOOL: ${{ vars.DEPLOY_TOOL || 'kustomize' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
    outputs:
      cluster: ${{ steps.ssm.outputs.cluster }}
      ecr_uri: ${{ steps.ssm.outputs.ecr_uri }}
      postgres_server: ${{ steps.ssm.outputs.postgres_server }}
      frontend_host: ${{ steps.ssm.outputs.frontend_host }}
      aws_secret_arn: ${{ steps.ssm.outputs.aws_secret_arn }}
      irsa_role_arn: ${{ steps.ssm.outputs.irsa_role_arn }}
      media_queue_url: ${{ steps.ssm.outputs.media_queue_url }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM parameters
        id: ssm
        run: |
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }

          CLUSTER=$(ssm_get eks_cluster_name)
          ECR_URI=$(ssm_get ecr_fastapi_app)
          POSTGRES_SERVER=$(ssm_get aurora_cluster_endpoint)
          FRONTEND_HOST=$(ssm_get site_url)
          AWS_SECRET_ARN=$(ssm_get aurora_master_user_secret_arn)
          IRSA_ROLE_ARN=$(ssm_get api_irsa_role_arn)
          MEDIA_QUEUE_URL=$(aws ssm get-parameter --name "${SSM_PREFIX}/media_queue_url" --query Parameter.Value --output text 2>/dev/null || true)
          if [ "$MEDIA_QUEUE_URL" = "None" ]; then MEDIA_QUEUE_URL=; fi

          echo "cluster=${CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=${ECR_URI}" >> "$GITHUB_OUTPUT"
          echo "postgres_server=${POSTGRES_SERVER}" >> "$GITHUB_OUTPUT"
          echo "frontend_host=${FRONTEND_HOST}" >> "$GITHUB_OUTPUT"
          echo "aws_secret_arn=${AWS_SECRET_ARN}" >> "$GITHUB_OUTPUT"
          echo "irsa_role_arn=${IRSA_ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "media_queue_url=${MEDIA_QUEUE_URL}" >> "$GITHUB_OUTPUT"
          echo "Cluster=${CLUSTER} ECR=${ECR_URI}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ssm.outputs.ecr_uri }}:${{ github.sha }}
            ${{ steps.ssm.outputs.ecr_uri }}:${{ env.FLOATING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
    concurrency:
      group: deploy-eks-${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3

      - name: Install kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install Helm
        if: env.DEPLOY_TOOL == 'helm'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Prepare secrets file
        id: secrets
        env:
          K8S_SECRETS_ENV: ${{ secrets.K8S_SECRETS_ENV }}
        run: |
          if [ -z "$K8S_SECRETS_ENV" ]; then
            echo "Missing GitHub secret K8S_SECRETS_ENV on environment ${DEPLOY_ENV}" >&2
            exit 1
          fi
          if [ -f "$K8S_SECRETS_ENV" ]; then
            CONTENT=$(cat "$K8S_SECRETS_ENV")
          else
            CONTENT=$K8S_SECRETS_ENV
          fi
          if printf '%s' "$CONTENT" | jq -e 'type == "object"' >/dev/null 2>&1; then
            printf '%s' "$CONTENT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > /tmp/secrets.env
          else
            printf '%s\n' "$CONTENT" > /tmp/secrets.env
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ needs.build.outputs.cluster }}" --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Verify cluster access
        run: |
          echo "GitHub Actions IAM identity (this ARN needs an EKS access entry):"
          aws sts get-caller-identity
          if ! kubectl get namespace "${K8S_NAMESPACE}"; then
            echo "EKS rejected these credentials. Add this IAM principal as an access entry on ${{ needs.build.outputs.cluster }} with AmazonEKSClusterAdminPolicy (terraform cluster_admin_principal_arns)." >&2
            exit 1
          fi

      - name: Deploy with Kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        env:
          POSTGRES_SERVER: ${{ needs.build.outputs.postgres_server }}
          FRONTEND_HOST: ${{ needs.build.outputs.frontend_host }}
          AWS_SECRET_ARN: ${{ needs.build.outputs.aws_secret_arn }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          MEDIA_QUEUE_URL: ${{ needs.build.outputs.media_queue_url }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          (
            cd "k8s/overlays/${OVERLAY}"
            cp /tmp/secrets.env secrets.env
            printf 'POSTGRES_SERVER=%s\nFRONTEND_HOST=%s\nAWS_SECRET_ARN=%s\nMEDIA_QUEUE_URL=%s\n' \
              "$POSTGRES_SERVER" "$FRONTEND_HOST" "$AWS_SECRET_ARN" "$MEDIA_QUEUE_URL" > generated-config.env
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: ServiceAccount' \
              'metadata:' \
              '  name: fastapi-app' \
              '  annotations:' \
              "    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}" \
              > irsa-patch.yaml
            kustomize edit set image "fastapi-app=${ECR_URI}:${IMAGE_TAG}"
          )
          kubectl apply -k "k8s/overlays/${OVERLAY}"
          kubectl rollout status "deployment/fastapi-app" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Deploy with Helm
        if: env.DEPLOY_TOOL == 'helm'
        env:
          POSTGRES_SERVER: ${{ needs.build.outputs.postgres_server }}
          FRONTEND_HOST: ${{ needs.build.outputs.frontend_host }}
          AWS_SECRET_ARN: ${{ needs.build.outputs.aws_secret_arn }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          MEDIA_QUEUE_URL: ${{ needs.build.outputs.media_queue_url }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REPLICAS=1
          INGRESS_HOST="api-test-k8s.dev.piercuta.com"
          if [ "${DEPLOY_ENV}" != "dev" ]; then
            REPLICAS=2
            INGRESS_HOST="api.test-k8s.piercuta.com"
          fi

          {
            printf '%s\n' \
              "replicaCount: ${REPLICAS}" \
              "image:" \
              "  repository: ${ECR_URI}" \
              "  tag: \"${IMAGE_TAG}\"" \
              "serviceAccount:" \
              "  annotations:" \
              "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
              "ingress:" \
              "  host: \"${INGRESS_HOST}\"" \
              "config:" \
              "  ENVIRONMENT: \"${DEPLOY_ENV}\"" \
              "  POSTGRES_SERVER: \"${POSTGRES_SERVER}\"" \
              "  FRONTEND_HOST: \"${FRONTEND_HOST}\"" \
              "  AWS_SECRET_ARN: \"${AWS_SECRET_ARN}\"" \
              "  MEDIA_QUEUE_URL: \"${MEDIA_QUEUE_URL}\"" \
              "secrets:"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"
              val="${line#*=}"
              printf '  %s: %s\n' "$key" "$(printf '%s' "$val" | jq -Rs .)"
            done < /tmp/secrets.env
          } > /tmp/helm-ci-values.yaml

          helm upgrade --install fastapi-app ./charts/fastapi-app \
            -n "${K8S_NAMESPACE}" \
            -f /tmp/helm-ci-values.yaml \
            --wait --timeout 180s
