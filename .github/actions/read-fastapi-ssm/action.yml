name: Read FastAPI SSM parameters
description: Load EKS, ECR, and app config from SSM for the FastAPI backend.

inputs:
  ssm_prefix:
    description: SSM parameter prefix (e.g. /test-k8s/dev)
    required: true

outputs:
  cluster:
    description: EKS cluster name
    value: ${{ steps.read.outputs.cluster }}
  ecr_uri:
    description: ECR repository URI for the API image
    value: ${{ steps.read.outputs.ecr_uri }}
  postgres_server:
    description: Aurora cluster endpoint
    value: ${{ steps.read.outputs.postgres_server }}
  frontend_host:
    description: Frontend site URL
    value: ${{ steps.read.outputs.frontend_host }}
  aws_secret_arn:
    description: Aurora master user secret ARN
    value: ${{ steps.read.outputs.aws_secret_arn }}
  cognito_client_id:
    description: Cognito app client ID
    value: ${{ steps.read.outputs.cognito_client_id }}
  cognito_issuer:
    description: Cognito issuer URL
    value: ${{ steps.read.outputs.cognito_issuer }}
  cognito_domain:
    description: Cognito hosted UI domain
    value: ${{ steps.read.outputs.cognito_domain }}
  irsa_role_arn:
    description: IRSA role ARN for the API ServiceAccount
    value: ${{ steps.read.outputs.irsa_role_arn }}
  media_queue_url:
    description: SQS media queue URL (optional)
    value: ${{ steps.read.outputs.media_queue_url }}

runs:
  using: composite
  steps:
    - name: Read SSM parameters
      id: read
      shell: bash
      env:
        SSM_PREFIX: ${{ inputs.ssm_prefix }}
      run: |
        set -euo pipefail

        ssm_get() {
          val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
          if [ -z "$val" ] || [ "$val" = "None" ]; then
            echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
            exit 1
          fi
          printf '%s' "$val"
        }

        CLUSTER=$(ssm_get eks_cluster_name)
        ECR_URI=$(ssm_get ecr_api)
        POSTGRES_SERVER=$(ssm_get aurora_cluster_endpoint)
        FRONTEND_HOST=$(ssm_get site_url)
        AWS_SECRET_ARN=$(ssm_get aurora_master_user_secret_arn)
        COGNITO_CLIENT_ID=$(ssm_get cognito_client_id)
        COGNITO_ISSUER=$(ssm_get cognito_issuer)
        COGNITO_DOMAIN=$(ssm_get cognito_domain)
        IRSA_ROLE_ARN=$(ssm_get api_irsa_role_arn)
        MEDIA_QUEUE_URL=$(aws ssm get-parameter --name "${SSM_PREFIX}/media_queue_url" --query Parameter.Value --output text 2>/dev/null || true)
        if [ "$MEDIA_QUEUE_URL" = "None" ]; then MEDIA_QUEUE_URL=; fi

        {
          echo "cluster=${CLUSTER}"
          echo "ecr_uri=${ECR_URI}"
          echo "postgres_server=${POSTGRES_SERVER}"
          echo "frontend_host=${FRONTEND_HOST}"
          echo "aws_secret_arn=${AWS_SECRET_ARN}"
          echo "cognito_client_id=${COGNITO_CLIENT_ID}"
          echo "cognito_issuer=${COGNITO_ISSUER}"
          echo "cognito_domain=${COGNITO_DOMAIN}"
          echo "irsa_role_arn=${IRSA_ROLE_ARN}"
          echo "media_queue_url=${MEDIA_QUEUE_URL}"
        } >> "$GITHUB_OUTPUT"

        echo "Cluster=${CLUSTER} ECR=${ECR_URI}"
